name: Agent docs sync

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/check-agent-sync.mjs"
      - ".github/workflows/agent-docs-sync.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-agent-sync.mjs
