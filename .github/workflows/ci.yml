name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  rust:
    name: Rust clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Deny-by-default clippy lints (correctness) fail the build. Existing
      # style warnings are tracked debt; see the E15 epic.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --all-targets

  typescript:
    name: TypeScript build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Only packages that contain tests; contracts and dashboard have none yet.
      - run: pnpm --filter @hexactra/sdk --filter @hexactra/chrome-extension test

  contracts:
    name: API contracts parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python3 scripts/ci/validate-contracts.py

  agent-sync:
    name: Agent instructions sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-agent-sync.mjs

  e2e-remote-control:
    name: Remote control e2e (real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hexactra/chrome-extension build
      - run: cargo build -p hexactra-cli -p hexactra-control -p hexactra-agent -p hexactra-native-host -p hexactra-mcp
      # Chromium (not branded Chrome) honours --load-extension.
      - name: Install Chromium and Xvfb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          npx -y playwright@1.49.1 install --with-deps chromium
          # Ubuntu 24.04 restricts unprivileged user namespaces, which the
          # Chromium sandbox needs; allow them instead of disabling the sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run e2e
        run: |
          CHROMIUM_PATH=$(find ~/.cache/ms-playwright -type f -name chrome -path '*/chromium-*' | grep -v headless | head -1)
          echo "Chromium: $CHROMIUM_PATH"
          CHROMIUM_PATH="$CHROMIUM_PATH" xvfb-run -a node tests/e2e/remote-control.e2e.mjs

  container:
    name: Container stack e2e (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images, start the stack and drive Chromium in the container
        run: bash tests/e2e/container.e2e.sh
