name: Console CI

# The Hexactra Console (EnterpriseAppBase starter app) lives in console/.
on:
  push:
    branches: [main]
    paths: ['console/**', 'deploy/container/**', 'crates/**', 'apps/chrome-extension/**', 'scripts/package-agent-bundle.mjs', 'scripts/pack-crx3.mjs', 'scripts/crx3.mjs', '.github/workflows/console.yml']
  pull_request:
    branches: [main]
    paths: ['console/**', 'deploy/container/**', 'crates/**', 'apps/chrome-extension/**', 'scripts/package-agent-bundle.mjs', 'scripts/pack-crx3.mjs', 'scripts/crx3.mjs', '.github/workflows/console.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Console typecheck, test, build, platform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hexactra_console_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The API builds its connection from POSTGRES_*; it runs as the ordinary
      # role created below, because row-level security is inert for a superuser.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: app
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hexactra_console_test
      POSTGRES_SSL: 'false'
      JWT_SECRET: ci-jwt-secret-not-a-real-secret-0000000000
      COOKIE_SECRET: ci-cookie-secret-not-a-real-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_CALLBACK_URL: http://127.0.0.1:3000/api/auth/google/callback
      INITIAL_ADMIN_EMAIL: admin@example.test
      OTEL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Create the ordinary application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE app LOGIN PASSWORD 'postgres' NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE;
          ALTER DATABASE "$POSTGRES_DB" OWNER TO app;
          ALTER SCHEMA public OWNER TO app;
          SQL

      - run: npm ci

      # The platform's lock and drift checks: installed migrations, the
      # composed schema and the infra fragments equal what the packages ship.
      - run: npm run platform:check

      - run: npm run prisma:generate --workspace=api
      - run: npm run prisma:validate --workspace=api
      - run: npm run typecheck
      # The SDK's types are generated from packages/sdk/openapi.json; the db
      # tier below checks that file equals the document the API serves.
      - run: npm run check:generated --workspace=@hexactra/console-sdk
      # Unit tests, runPlatformConformance(), web and CLI suites.
      - run: npm test
      - run: npm run build

      # The db tier: the whole app against the migrated, seeded database.
      - run: npm run prisma:migrate --workspace=api
      - run: npm run prisma:seed --workspace=api
      # The agent frameworks docs/recipes/ targets, pinned to the versions the
      # recipes were checked against; agent-clients.db.spec.ts runs their CLIs.
      # hermes-agent 0.19.0 requires Python >=3.11,<3.14.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Hermes Agent, OpenClaw and Pi
        run: |
          npm install --prefix "$RUNNER_TEMP/agents" --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.2 openclaw@2026.11.3
          python3 -m venv "$RUNNER_TEMP/hermes"
          "$RUNNER_TEMP/hermes/bin/pip" install -q "hermes-agent[mcp]==0.19.0"
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/hermes/bin" >> "$GITHUB_PATH"
      - run: npm run test:db --workspace=api
        env:
          AGENT_CLIENTS_SMOKE: '1'

  stack:
    name: Console VPS stack (console + fabric + browser host)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build --workspace=cli
      # Builds every image, brings the stack up, and checks health, the private
      # fabric, the bundled host and the /viewer/local/ ticket gate.
      - run: bash scripts/stack-smoke.sh

  node-e2e:
    name: Unattended node end to end (real sudo and systemd)
    # A VM runner, like a mini PC: systemd, passwordless sudo, no GPU (the
    # node falls back to software rendering and doctor warns).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build the agent, native host and fabric (release)
        run: cargo build --release --locked -p hexactra-agent -p hexactra-native-host -p hexactra-control
      - name: Build the extension
        run: pnpm install --frozen-lockfile && pnpm --filter "@hexactra/chrome-extension..." build
      - name: Build the console CLI
        working-directory: console
        run: npm ci && npm run build --workspace=cli
      - run: sudo apt-get update -qq
      # Installs the node exactly as a person would, then checks it from the
      # fabric's side (console/scripts/node-e2e.sh). With the signing key it
      # also checks Google Chrome's policy install of the extension.
      - name: Unattended node end to end
        env:
          EXTENSION_CRX_KEY: ${{ secrets.EXTENSION_CRX_KEY }}
        run: bash console/scripts/node-e2e.sh
      - name: Logs
        if: failure()
        run: |
          sudo journalctl -u hexactra-desktop -u hexactra-session -u hexactra-node-agent -n 300 --no-pager || true
          ls -la /run/hexactra /var/lib/hexactra 2>&1 | head -40 || true
