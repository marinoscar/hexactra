name: E2E Acceptance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Filter tests by name (comma-separated)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  HEXACTRA_TEST_MODE: e2e

jobs:
  # Extension standalone tests
  extension-standalone:
    name: Extension Standalone Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Build Chrome Extension
        working-directory: apps/chrome-extension
        run: pnpm build
      
      - name: Run extension tests
        working-directory: apps/chrome-extension
        run: pnpm test --mode=standalone

  # Real browser tests
  real-browser:
    name: Real Browser Tests
    runs-on: ubuntu-latest
    services:
      chrome:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Wait for Chrome
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4444/status > /dev/null; then
              echo "Chrome is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Chrome failed to start"
          exit 1
      
      - name: Run browser tests
        working-directory: tests/browser
        run: node test-browser.js

  # Linux no-login profile tests
  linux-no-login:
    name: Linux No-Login Profile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build release binaries
        run: cargo build --release
      
      - name: Create test profile directory
        run: |
          mkdir -p /tmp/hexactra-test-profile
          echo '{"test": true}' > /tmp/hexactra-test-profile/config.json
      
      - name: Test profile persistence
        run: |
          # Simulate no-login scenario
          export HEXACTRA_PROFILE_DIR=/tmp/hexactra-test-profile
          ./target/release/hexactra-native-host --help || true
          echo "Profile directory created and accessible"

  # Managed goal tests
  managed-goal:
    name: Managed Goal Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build release binaries
        run: cargo build --release
      
      - name: Run managed goal tests
        run: |
          # Run Rust integration tests for agent
          cargo test --package hexactra-agent-run --test managed_goal

  # SDK/CLI/MCP equivalence tests
  sdk-cli-mcp:
    name: SDK/CLI/MCP Equivalence Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build SDK
        working-directory: packages/sdk
        run: pnpm build
      
      - name: Run SDK tests
        working-directory: packages/sdk
        run: pnpm test
      
      - name: Build CLI
        run: cargo build --package hexactra-cli
      
      - name: Run CLI tests
        run: |
          cargo test --package hexactra-cli

  # HITL flow tests
  hitl-flow:
    name: HITL Flow Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run HITL tests
        run: |
          cargo test --package hexactra-control --test hitl

  # Telemetry outage tests
  telemetry-outage:
    name: Telemetry Outage Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run telemetry tests
        run: |
          cargo test --package hexactra-telemetry

  # Profile isolation tests
  profile-isolation:
    name: Profile Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run profile isolation tests
        run: |
          cargo test --package hexactra-core --test profile_isolation

  # Security regression tests
  security-regressions:
    name: Security Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run security tests
        run: |
          cargo test --package hexactra-control --test security

  # Generate acceptance manifest
  generate-manifest:
    name: Generate Acceptance Manifest
    runs-on: ubuntu-latest
    needs:
      - extension-standalone
      - real-browser
      - linux-no-login
      - managed-goal
      - sdk-cli-mcp
      - hitl-flow
      - telemetry-outage
      - profile-isolation
      - security-regressions
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate acceptance manifest
        run: |
          bash scripts/run-e2e-acceptance.sh manifest tests/e2e/acceptance-manifest.json
      
      - name: Upload acceptance manifest
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-manifest
          path: tests/e2e/acceptance-manifest.json

  # Release gate
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs:
      - generate-manifest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download acceptance manifest
        uses: actions/download-artifact@v4
        with:
          name: acceptance-manifest
          path: tests/e2e/
      
      - name: Verify acceptance criteria
        run: |
          if [ ! -f tests/e2e/acceptance-manifest.json ]; then
            echo "Error: Acceptance manifest not found"
            exit 1
          fi
          
          # Check that all critical tests passed
          if ! grep -q '"all_critical_tests_pass": true' tests/e2e/acceptance-manifest.json; then
            echo "Error: Not all critical tests passed"
            exit 1
          fi
          
          # Check that all high priority tests passed
          if ! grep -q '"all_high_priority_tests_pass': true' tests/e2e/acceptance-manifest.json; then
            echo "Warning: Not all high priority tests passed"
          fi
          
          echo "Release gate passed!"
      
      - name: Create release PR
        if: github.event_name == 'push'
        run: |
          # This would create a release PR if all tests pass
          echo "All E2E acceptance tests passed!"
          echo "Ready for release"
