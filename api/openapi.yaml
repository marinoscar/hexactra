openapi: 3.1.0
info:
  title: Hexactra Fabric API
  description: 'Remote browser control: hosts, sessions and actions, human handoffs, webhooks, host commands, artifacts and the event stream. Generated from the server code; see docs/remote-control-api.md for the guide.'
  contact:
    name: Oscar Marin
    email: marinoscar@users.noreply.github.com
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
servers:
- url: http://127.0.0.1:8787
  description: Default local bind
paths:
  /v1/admin/hosts/enrollments:
    get:
      tags:
      - credentials
      operationId: list_enrollments
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentList'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
    post:
      tags:
      - credentials
      operationId: create_enrollment
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: 'null'
              - $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedEnrollment'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
  /v1/admin/hosts/{id}:
    delete:
      tags:
      - credentials
      operationId: revoke_host
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Revoked and removed
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown host
  /v1/admin/service-tokens:
    get:
      tags:
      - credentials
      operationId: list_service_tokens
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTokenList'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
    post:
      tags:
      - credentials
      operationId: create_service_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceTokenRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedServiceToken'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
  /v1/admin/service-tokens/{id}:
    delete:
      tags:
      - credentials
      operationId: revoke_service_token
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Revoked
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown token
  /v1/artifacts/{id}:
    get:
      tags:
      - artifacts
      operationId: get_artifact
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The artifact bytes
          content:
            image/jpeg:
              schema:
                type: array
                items:
                  type: integer
                  format: int32
                  minimum: 0
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown or expired
  /v1/desktop/{tunnel_id}/connect:
    get:
      tags:
      - desktop
      summary: '`GET /v1/desktop/{tunnel_id}/connect` (WebSocket): the viewer''s leg.'
      operationId: client_connect
      parameters:
      - name: tunnel_id
        in: path
        description: Tunnel id from POST /v1/hosts/{id}/desktop-sessions
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '101':
          description: 'WebSocket upgrade: binary messages carry the desktop stream (RFB). `Authorization: Bearer hxd_…` (single use, 30 s). Close codes: 4504 the node did not connect, 4408 idle, 4000 maximum duration'
        '401':
          description: Missing, invalid, used or expired desktop token
      security: []
  /v1/events:
    get:
      tags:
      - events
      operationId: events
      parameters:
      - name: after
        in: query
        description: Resume after this seq
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: types
        in: query
        description: Comma-separated type patterns, e.g. `operation.*`
        required: false
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Server-sent events; each `data` is a FabricEvent
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/FabricEvent'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
  /v1/handoffs:
    get:
      tags:
      - handoffs
      operationId: list
      parameters:
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: pending
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffList'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
  /v1/handoffs/{id}:
    get:
      tags:
      - handoffs
      operationId: read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: wait_ms
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffView'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown handoff
  /v1/handoffs/{id}/cancel:
    post:
      tags:
      - handoffs
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffView'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '409':
          description: Already resolved
  /v1/handoffs/{id}/claim:
    post:
      tags:
      - handoffs
      description: 'Deprecated: returns a `secret` answer to the caller, once. Use a `type_secret` action (`POST /v1/sessions/{id}/actions`) instead: the control plane types the secret into the page and never returns it. Operator and service tokens only.'
      operationId: claim
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimedHandoffValue'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown handoff
        '409':
          description: '`secret_unavailable`: not answered yet, already used, erased or expired'
        '422':
          description: '`handoff_not_secret`'
      deprecated: true
  /v1/handoffs/{id}/respond:
    get:
      tags:
      - handoffs
      summary: '`GET /v1/handoffs/{id}/respond?token=` — a minimal page for link channels.'
      operationId: form
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: token
        in: query
        description: The handoff response token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Answer page
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Missing token
        '403':
          description: Invalid or used token
      security:
      - {}
    post:
      tags:
      - handoffs
      summary: |-
        `POST /v1/handoffs/{id}/respond` — JSON (`RespondHandoffRequest`) or an
        HTML form submission.
      operationId: respond
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: 'JSON with the response token (`response_token` or the `X-Hexactra-Response-Token` header) or an operator or service token (`Authorization: Bearer`), or an HTML form with `token`, `outcome`, `value` and `values` (repeated)'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondHandoffRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffView'
        '403':
          description: Invalid or used token
        '409':
          description: Already resolved
      security:
      - {}
  /v1/health:
    get:
      tags:
      - health
      operationId: health
      responses:
        '200':
          description: Liveness and version
          content:
            application/json:
              schema:
                type: object
      security:
      - {}
  /v1/host-commands/{id}:
    get:
      tags:
      - host-commands
      operationId: get_command
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: wait_ms
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCommandView'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown command
  /v1/hosts:
    get:
      tags:
      - hosts
      operationId: list_hosts
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostList'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
  /v1/hosts/enroll:
    post:
      tags:
      - credentials
      operationId: enroll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '403':
          description: Invalid, used or expired enrollment token
      security:
      - {}
  /v1/hosts/register:
    post:
      tags:
      - agent
      operationId: register_host
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterHostRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterHostResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
  /v1/hosts/{host_id}/commands:
    get:
      tags:
      - host-commands
      operationId: list_commands
      parameters:
      - name: host_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCommandList'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
    post:
      tags:
      - host-commands
      operationId: create_command
      parameters:
      - name: host_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: async
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostCommandRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCommandView'
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCommandView'
        '400':
          description: Invalid command
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown host
        '409':
          description: Profile in use
  /v1/hosts/{host_id}/commands/{command_id}/result:
    post:
      tags:
      - agent
      operationId: post_result
      parameters:
      - name: host_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: command_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationResult'
        required: true
      responses:
        '204':
          description: Recorded
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown command
        '409':
          description: Not dispatched
  /v1/hosts/{host_id}/desktop/{tunnel_id}:
    get:
      tags:
      - agent
      summary: '`GET /v1/hosts/{host_id}/desktop/{tunnel_id}` (WebSocket): the node''s leg.'
      operationId: host_connect
      parameters:
      - name: host_id
        in: path
        description: This host's id
        required: true
        schema:
          type: string
          format: uuid
      - name: tunnel_id
        in: path
        description: From the open_desktop host command
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '101':
          description: 'WebSocket upgrade: the agent relays its local desktop server''s bytes as binary messages'
        '401':
          description: Missing or invalid host credential
        '403':
          description: This credential belongs to another host
        '404':
          description: No such tunnel for this host
        '409':
          description: The tunnel already has its host
  /v1/hosts/{host_id}/next:
    get:
      tags:
      - agent
      operationId: next_operation
      parameters:
      - name: host_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: wait_ms
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: browser_connected
        in: query
        required: false
        schema:
          type: boolean
      - name: on_demand
        in: query
        required: false
        schema:
          type: boolean
      - name: profiles
        in: query
        description: Comma-separated profiles the host has
        required: false
        schema:
          type: string
      - name: running
        in: query
        description: Comma-separated profiles running now
        required: false
        schema:
          type: string
      - name: commands
        in: query
        description: The agent accepts host commands
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: 'An operation, or `{ "command": … }`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostWork'
        '204':
          description: Nothing to do
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown host
  /v1/hosts/{host_id}/offline:
    post:
      tags:
      - agent
      operationId: host_offline
      parameters:
      - name: host_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Marked offline
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
  /v1/hosts/{host_id}/operations/{op_id}/result:
    post:
      tags:
      - agent
      operationId: post_result
      parameters:
      - name: host_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: op_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationResult'
        required: true
      responses:
        '204':
          description: Recorded
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown operation
        '409':
          description: Not dispatched, or already reported
  /v1/hosts/{id}/desktop-sessions:
    post:
      tags:
      - desktop
      summary: |-
        `POST /v1/hosts/{id}/desktop-sessions`: reserve a tunnel, ask the host to
        connect its desktop, return the single-use connect token.
      operationId: create_desktop_session
      parameters:
      - name: id
        in: path
        description: Host id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDesktopSessionRequest'
        required: true
      responses:
        '201':
          description: Connect within 30 seconds with the token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopSession'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown host
        '409':
          description: host_offline or desktop_unavailable
        '429':
          description: Too many open desktops
  /v1/hosts/{id}/takeover:
    get:
      tags:
      - desktop
      summary: '`GET /v1/hosts/{id}/takeover`: the live lease, or 404.'
      operationId: current
      parameters:
      - name: id
        in: path
        description: Host id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '404':
          description: Nobody controls it
    post:
      tags:
      - desktop
      summary: '`POST /v1/hosts/{id}/takeover`'
      operationId: take_over
      parameters:
      - name: id
        in: path
        description: Host id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeoverRequest'
        required: true
      responses:
        '201':
          description: The person controls the desktop; new actions on this host answer 409 takeover_active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown host
        '409':
          description: 'takeover_held: someone else controls it'
  /v1/hosts/{id}/takeover/{lease_id}:
    delete:
      tags:
      - desktop
      summary: '`DELETE /v1/hosts/{id}/takeover/{lease_id}`'
      operationId: release
      parameters:
      - name: id
        in: path
        description: Host id
        required: true
        schema:
          type: string
          format: uuid
      - name: lease_id
        in: path
        description: Lease id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: 'Released: the agent continues'
        '404':
          description: No such lease
  /v1/hosts/{id}/takeover/{lease_id}/renew:
    post:
      tags:
      - desktop
      summary: '`POST /v1/hosts/{id}/takeover/{lease_id}/renew`'
      operationId: renew
      parameters:
      - name: id
        in: path
        description: Host id
        required: true
        schema:
          type: string
          format: uuid
      - name: lease_id
        in: path
        description: Lease id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '404':
          description: No such live lease
  /v1/operations/{id}:
    get:
      tags:
      - sessions
      operationId: get_operation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: wait_ms
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown operation
  /v1/secrets-providers/{owner_id}:
    get:
      tags:
      - secrets
      description: The owner's live registrations. Never a token.
      operationId: list
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretsProviderList'
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
  /v1/secrets-providers/{owner_id}/{provider}:
    put:
      tags:
      - secrets
      description: 'Register (or replace) the secrets provider an owner''s sessions use for `secrets_lookup`, `type_from_provider`, `type_code_from_provider`, `select_from_provider` and `type_card_field`. The access token is held in memory only: never written to the state database, never returned, never logged. A registration with `expires_at` disappears then; register again with a fresh token. Kind `vault` (a Vault''s agent credential API) needs `base_url` (the Vault''s `APP_URL`, `https` or loopback `http`), `access_token` (the short-lived `oat_` token) and `expires_at`. Kind `console` (the console''s built-in store, which the fabric calls back) needs `base_url` (the console''s internal address, `https` or `http` on a private network such as `http://api:3000/api/internal/secrets-store/v1`), `access_token` (the owner''s `sct_` credential) and `expires_at`; `test` exists only in builds with the `test-provider` feature.'
      operationId: register
      parameters:
      - name: owner_id
        in: path
        description: The owner's user id, as a session's `owner_id`
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: 'The id actions name: `vault`, `builtin`, `test`'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSecretsProviderRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretsProviderView'
        '400':
          description: Invalid owner, provider id, `base_url` or expiry
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '501':
          description: '`provider_kind_unsupported`'
    delete:
      tags:
      - secrets
      description: Drop a registration, and with it the provider's token. Idempotent.
      operationId: remove
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
      - name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Removed (or there was none)
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
  /v1/secrets-providers/{owner_id}/{provider}/save-login:
    post:
      tags:
      - secrets
      description: 'Save the sign-in the owner typed into a `credentials` handoff (E37.4b), so the next run does not ask. The handoff must have been created with `offer_save: true` and answered, and the password typed with a `type_secret` action: the control plane keeps a copy in memory for ten minutes after the answer (surviving the end of the session) and sends it to the provider''s create route (Vault: `POST /credentials`, `purpose: "save_login"`, scope `vault:items_write`, agent contract 1.3), bound to `origin`. The caller never holds the password and the answer never carries it: `{ saved: true, item_id }`. The copy is consumed only on success: a taken name (`409 name_taken`), an unreachable provider or a refused token leaves it, so the owner can try again until it expires. A password that is gone (saved, erased, expired, a restart, or being saved by another call) is `409 secret_unavailable`; a handoff that is not the owner''s, or was not created with `offer_save`, is `404 not_found`. Provider failures keep their codes (`name_taken`, `unauthorized`, `disabled`, `rate_limited`, `unavailable`, `refused`, `unsupported`, `timed_out`). The audit event is `secrets.release` with purpose `save_login`, field `password` and outcome `saved` or the failure code: never the password or the username.'
      operationId: save_login
      parameters:
      - name: owner_id
        in: path
        description: The owner's user id, as a session's `owner_id`
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: 'The provider to save in: `vault`'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveLoginResult'
        '400':
          description: Invalid name or origin
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: No such provider, handoff or offer
        '409':
          description: '`name_taken` or `secret_unavailable`'
        '422':
          description: The provider cannot save or refused
        '429':
          description: Rate limited by the provider
        '502':
          description: The provider was unreachable or refused the token
