  /v1/sessions/{id}/actions:
    post:
      tags:
      - sessions
      description: 'Queue an action on the session''s host. A `type_secret` action types the answer of a `secret` handoff of this session: the control plane consumes the value once and the operation, events and logs show `[secret]`, never the value. A `type` action with `sensitive: true` is reported the same way. `secrets_lookup`, `type_from_provider`, `type_code_from_provider`, `select_from_provider` and `type_card_field` are answered by the control plane from the session owner''s registered secrets provider (`PUT /v1/secrets-providers/{owner_id}/{provider}`): it reads the tab''s top-level origin itself, asks the provider with it, and types the value with `sensitive: true` (or, for `select_from_provider`, picks the matching `<select>` option itself); the operation reports `{ typed: true }` or `{ selected: true }`, never the value, never its length. A sensitive identity field (a date of birth, an ID number) is only typed into an `https` page. A failure is `state: failed` with `error: "<code>: <message>"` (`no_provider`, `not_found`, `origin_mismatch`, `disabled`, `rate_limited`, `unavailable`, `unauthorized`, `refused`, `origin_unavailable`, `cross_origin_frame`, `typing_failed`, `insecure_origin`, `no_option`, `amount_exceeded`, `currency_mismatch`, `security_code_not_granted`, `grant_expired`, `limit_reached`, `cards_disabled`, `frame_unknown`, `target_not_password`, `timed_out`). Every typing the control plane queues for a provider action carries `expect_origin` (the origin it verified), which the extension checks against the tab''s top-level origin at the moment of typing: a navigation in between types nothing and fails with `origin_mismatch`. A login''s password is only typed into an `input` of type `password` (or a text input with `autocomplete` of `current-password` or `new-password`): any other target is `target_not_password`, checked before the provider is asked. `type_card_field` (E37.7) types one field of a saved card under the owner''s merchant grant: the page must be `https`, the control plane reads the merchant''s top-level origin and, for a point inside an embedded frame, that frame''s origin (`frame_unknown` when it cannot tell), and passes both with the purchase''s `amount` and `currency` to the provider; it reports `{ typed: true, frame_origin? }`.'
      operationId: run_action
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: async
        in: query
        description: Return 202 at once
        required: false
        schema:
          type: boolean
      - name: inline_artifacts
        in: query
        description: Also return screenshot bytes inline
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
        required: true
      responses:
        '200':
          description: Final state (succeeded, failed, timed_out, cancelled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        '202':
          description: Queued (`?async=true`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        '400':
          description: Invalid action
        '401':
          description: Missing or invalid token
        '403':
          description: Token not allowed here
        '404':
          description: Unknown session, or (`type_secret`) unknown handoff
        '409':
          description: Session ended, a handoff is pending, or (`type_secret`, `secret_unavailable`) the secret is not answered, already used, erased or expired
        '422':
          description: '`type_secret`: `handoff_wrong_session` or `handoff_not_secret`'
  /v1/sessions/{id}/handoffs:
    post:
      tags:
      - handoffs
      operationId: create
