      - provider
      - kind
      - registered_at
      properties:
        base_url:
          type:
          - string
          - 'null'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        kind:
          $ref: '#/components/schemas/SecretsProviderKind'
        owner_id:
          type: string
        provider:
          type: string
        registered_at:
          type: string
          format: date-time
    SelectPart:
      type: string
      description: |-
        Which part of a date a `select_from_provider` action chooses, when a date
        of birth is split into three selects.
      enum:
      - day
      - month
      - year
    ServiceTokenList:
      type: object
      required:
      - service_tokens
      properties:
        service_tokens:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTokenView'
    ServiceTokenView:
      type: object
      description: A service token as listed (never includes the token).
      required:
      - id
      - name
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
    SessionList:
      type: object
      required:
      - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionView'
    SessionView:
      type: object
      description: A remote-control session bound to one host.
      required:
      - id
      - host_id
      - status
      - created_at
      properties:
        allowed_domains:
          type: array
          items:
            type: string
          description: 'The session''s allowed sites, normalized (#508). Empty: any site.'
        created_at:
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        host_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        label:
          type:
          - string
          - 'null'
        owner_id:
          type:
          - string
          - 'null'
          description: |-
            Whose session this is (from the console: the owner's user id). The
            secrets provider actions use the owner's registered providers (#590).
        profile:
          type: string
          description: Browser profile this session drives.
        status:
          $ref: '#/components/schemas/RemoteSessionStatus'
    TakeoverActor:
      type: object
      description: Who holds a lease.
      required:
      - user_id
      properties:
        display_name:
          type:
          - string
          - 'null'
        user_id:
          type: string
          description: The console user; a desktop tunnel opened for the same user may send input.
    TakeoverRequest:
      type: object
      description: '`POST /v1/hosts/{id}/takeover`'
      required:
      - actor
      properties:
        actor:
          $ref: '#/components/schemas/TakeoverActor'
        ttl_s:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ViewportPoint:
      type: object
      description: A point in a page's viewport, in CSS pixels.
      required:
      - x
      - y
      properties:
        x:
          type: integer
          format: int64
        y:
          type: integer
          format: int64
    WebhookDelivery:
      type: object
      description: One delivery attempt.
      required:
      - event_id
      - event_type
      - attempt
      - at
      - outcome
      properties:
        at:
          type: string
          format: date-time
        attempt:
          type: integer
          format: int32
          minimum: 0
        error:
          type:
          - string
          - 'null'
        event_id:
          type: string
        event_type:
          type: string
        http_status:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        outcome:
          type: string
          description: '`succeeded`, `retrying` or `failed`.'
    WebhookList:
      type: object
      required:
      - webhooks
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookView'
    WebhookView:
      type: object
      description: A webhook endpoint (never includes the secret).
      required:
      - id
      - url
      - events
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type:
          - string
          - 'null'
        events:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        url:
          type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Operator token, service token (`hxs_…`) for client routes, or a host token (`hxh_…`) for that host's agent routes
security:
- bearer: []
tags:
- name: sessions
  description: Sessions, actions and operations
- name: hosts
  description: Registered hosts
- name: host-commands
  description: Manage a host's profiles and browsers
- name: handoffs
  description: Ask a person for help
- name: webhooks
  description: Channels that reach a person
- name: events
  description: Server-sent event stream
- name: artifacts
  description: Short-lived screenshot bytes
- name: secrets
  description: Per-owner secrets providers the fabric types stored secrets from
- name: credentials
  description: Host enrollment and service tokens
- name: agent
  description: Routes used by host agents
- name: desktop
  description: Remote desktop tunnels to a node (the WebSocket legs are `GET /v1/desktop/{tunnel_id}/connect` and `GET /v1/hosts/{host_id}/desktop/{tunnel_id}`)
- name: health
  description: Liveness
