components:
  schemas:
    ActionRequest:
      type: object
      description: '`POST /v1/sessions/{id}/actions`'
      required:
      - action
      properties:
        action:
          $ref: '#/components/schemas/RemoteAction'
        inline_artifacts:
          type: boolean
          description: |-
            Also return screenshot bytes inline (`data`, base64) next to the
            artifact handle. For clients that have not moved to
            `GET /v1/artifacts/{id}` yet.
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: How long to wait for a result before the operation times out.
          minimum: 0
    BlockedNavigation:
      type: object
      description: |-
        A top-level navigation the browser refused because its host is not in the
        session's allowed sites (#508). Only the host is kept, never the full URL.
      required:
      - host
      - at
      properties:
        at:
          type: string
          format: date-time
          description: When the browser blocked it.
        host:
          type: string
    CardField:
      type: string
      description: |-
        One card field a `type_card_field` action types (E37.7). `expiry` is
        composed inside the fabric from the two released parts (`MM/YY`) for a
        page that has one combined input; it is never returned.
      enum:
      - number
      - expiry
      - exp_month
      - exp_year
      - holder_name
      - postal_code
      - security_code
    ClaimedHandoffValue:
      type: object
      description: |-
        `POST /v1/handoffs/{id}/claim` (deprecated): the secret value, returned
        once. Use a `type_secret` action instead, which never returns it.
      required:
      - value
      properties:
        value:
          type: string
    CreateDesktopSessionRequest:
      type: object
      description: '`POST /v1/hosts/{id}/desktop-sessions`'
      properties:
        actor:
          $ref: '#/components/schemas/DesktopActor'
    CreateEnrollmentRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        ttl_s:
          type:
          - integer
          - 'null'
          format: int64
          description: Validity in seconds (default 3600, at most 7 days).
          minimum: 0
    CreateHandoffRequest:
      type: object
      description: '`POST /v1/sessions/{id}/handoffs`'
      required:
      - kind
      - prompt
      properties:
        choices:
          type: array
          items:
            $ref: '#/components/schemas/HandoffChoiceSpec'
          description: |-
            Options for `choice` and `multi_choice` (1-10): bare strings or
            `{id, label, description?}` objects.
        confirm_label:
          type:
          - string
          - 'null'
          description: '`confirm`: label of the approve button (at most 40 characters).'
        constraints:
          $ref: '#/components/schemas/HandoffConstraints'
          description: Bounds on the answer (see `HandoffConstraints`).
        deny_label:
          type:
          - string
          - 'null'
          description: '`confirm`: label of the deny button (at most 40 characters).'
        input:
          $ref: '#/components/schemas/HandoffInput'
        kind:
          $ref: '#/components/schemas/HandoffKind'
        offer_save:
          type: boolean
          description: |-
            `credentials` only (E37.4b): keep a copy of the password in the
            control plane's memory after a `type_secret` action types it, so the
            owner can still ask the secrets provider to save the sign-in for
            [`SAVE_OFFER_TTL_SECS`] seconds after they gave it (`POST
            /v1/secrets-providers/{owner_id}/{provider}/save-login`). The copy is
            zeroed when used, when the time is up and on a restart; it is never
            returned or persisted. Off by default: without it the password is gone
            once typed.
        page:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoffPage'
        prompt:
          type: string
          description: What the human should do, in plain words.
        remember:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoffRemember'
            description: |-
              `credentials` and `secret`: the site's "remember me" option, for the
              person to tick or not; the answer's `remember` says what they chose.
        risk:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoffRisk'
            description: '`confirm`: how risky approving is (default `high`).'
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    CreateHandoffResponse:
      type: object
      description: Response to creating a handoff.
      required:
      - handoff
      - response_token
      - respond_path
      properties:
        handoff:
          $ref: '#/components/schemas/HandoffView'
        respond_path:
          type: string
          description: |-
            Path of the respond endpoint (JSON POST, or GET for an HTML form
            with `?token=`).
        response_token:
          type: string
          description: Single-use token any channel can use to answer this handoff.
    CreateServiceTokenRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    CreateSessionRequest:
      type: object
      description: '`POST /v1/sessions`'
      properties:
        allowed_domains:
          type: array
          items:
            type: string
          description: |-
            Sites the session may load as top-level pages (#508): a listed domain
            covers its subdomains, an IP literal only itself. Empty: any site.
            The browser blocks every other top-level navigation, including ones a
            page starts itself, and reports it as `navigation_blocked`.
        create_profile:
          type: boolean
          description: Allow creating the profile on an on-demand host that does not have it.
        host_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Pin the session to a host; otherwise the control plane picks an online
            host that has the profile.
        label:
          type:
          - string
          - 'null'
        owner_id:
          type:
          - string
          - 'null'
          description: |-
            Whose session this is (the console's user id). Needed for the secrets
            provider actions: they use the owner's registered providers (#590).
        profile:
          type:
          - string
          - 'null'
          description: Browser profile to use (default `default`).
    CreateWebhookRequest:
      type: object
      description: '`POST /v1/webhooks`'
      required:
      - url
      properties:
        description:
          type:
          - string
          - 'null'
        events:
          type: array
          items:
            type: string
          description: Event filters; defaults to `["handoff.*"]`.
        url:
          type: string
    CreatedEnrollment:
      type: object
      required:
      - enrollment
      - enrollment_token
      properties:
        enrollment:
          $ref: '#/components/schemas/EnrollmentView'
        enrollment_token:
          type: string
          description: Single-use token (`hxe_…`) for `hexactra-agent daemon --enrollment-token`.
    CreatedServiceToken:
      type: object
      required:
      - service_token
      - token
      properties:
        service_token:
          $ref: '#/components/schemas/ServiceTokenView'
        token:
          type: string
          description: The token (`hxs_…`). Shown once.
    CreatedWebhook:
      type: object
      description: 'Response to creating a webhook: the signing secret is shown only here.'
      required:
      - webhook
      - secret
      properties:
        secret:
          type: string
          description: Standard Webhooks secret (`whsec_<base64>`).
        webhook:
          $ref: '#/components/schemas/WebhookView'
    DeliveryList:
      type: object
      required:
      - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
    DesktopActor:
      type: object
      description: 'Who opens a remote desktop (from the console: the signed-in person).'
      properties:
        display_name:
          type:
          - string
          - 'null'
        org_id:
          type:
          - string
          - 'null'
        user_id:
          type:
          - string
          - 'null'
    DesktopSession:
      type: object
      description: |-
        A desktop tunnel waiting for its viewer. `connect_token` is shown once:
        the viewer presents it as `Authorization: Bearer` on
        `GET /v1/desktop/{tunnel_id}/connect` (WebSocket) within 30 seconds.
      required:
      - tunnel_id
      - host_id
      - connect_token
      - expires_at
      properties:
        connect_token:
          type: string
        expires_at:
          type: string
          format: date-time
        host_id:
          type: string
          format: uuid
        tunnel_id:
          type: string
          format: uuid
    DispatchedCommand:
      type: object
      description: A command handed to a host on its poll.
      required:
      - id
      - command
      - deadline
      properties:
        command:
          $ref: '#/components/schemas/HostCommand'
        deadline:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        traceparent:
          type:
          - string
          - 'null'
          description: W3C trace context of the request that queued the command (#215).
    DispatchedOperation:
      type: object
      description: An operation handed to a host agent by `GET /v1/hosts/{id}/next`.
      required:
      - id
      - session_id
      - action
      - deadline
      properties:
        action:
          $ref: '#/components/schemas/RemoteAction'
        allowed_domains:
          type: array
          items:
            type: string
          description: |-
            The session's allowed sites (#508); the host hands them to the browser
            with the action. Empty: any site.
        deadline:
          type: string
          format: date-time
          description: Deadline the host should respect when executing.
        id:
          type: string
          format: uuid
        profile:
          type: string
          description: Profile whose browser runs the action.
        session_id:
          type: string
          format: uuid
        traceparent:
          type:
          - string
          - 'null'
          description: W3C trace context of the request that queued the action (#215).
    EnrollRequest:
      type: object
      description: '`POST /v1/hosts/enroll`'
      required:
      - enrollment_token
      properties:
        enrollment_token:
          type: string
        name:
          type:
          - string
          - 'null'
          description: Host display name (defaults to the enrollment's suggested name).
        version:
          type:
          - string
          - 'null'
    EnrollResponse:
      type: object
      required:
      - host_id
      - host_token
      properties:
        host_id:
          type: string
          format: uuid
        host_token:
          type: string
          description: The host's own credential (`hxh_…`). Shown once.
    EnrollmentList:
      type: object
      required:
      - enrollments
      properties:
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentView'
    EnrollmentView:
      type: object
      description: A pending host enrollment.
      required:
      - id
      - created_at
      - expires_at
      properties:
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
          description: Suggested host name (the host may send its own).
    FabricEvent:
      type: object
      description: One fabric event.
      required:
      - seq
      - type
      - at
      - data
      properties:
        at:
          type: string
          format: date-time
        data: {}
        seq:
          type: integer
          format: int64
          minimum: 0
        type:
          type: string
          description: e.g. `operation.completed`, `session.created`, `host.offline`.
    HandoffChoice:
      type: object
      description: One option of a `choice` or `multi_choice` question, as returned.
      required:
      - id
      - label
      properties:
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          description: What the answer carries (exact match).
        label:
          type: string
          description: What the human sees.
    HandoffChoiceSpec:
      oneOf:
      - type: string
        description: A bare label, also used as the id.
      - $ref: '#/components/schemas/HandoffChoice'
        description: An option with its own id.
      description: |-
        An option as a caller may send it: a bare string (used as both id and
        label) or `{id, label, description?}`.
    HandoffConstraints:
      type: object
      description: |-
        Bounds on an answer. Each field applies only to some inputs; sending one
        that does not apply is a validation error.
      properties:
        max:
          type:
          - number
          - 'null'
          format: double
          description: '`number`: largest accepted value.'
        max_length:
          type:
          - integer
          - 'null'
          format: int32
          description: '`text` (1-4096, default 4096) and `secret`: longest answer in characters.'
          minimum: 0
        max_selections:
          type:
          - integer
          - 'null'
          format: int32
          description: '`multi_choice`: most options to select (default: all of them).'
          minimum: 0
        min:
          type:
          - number
          - 'null'
          format: double
          description: '`number`: smallest accepted value.'
        min_selections:
          type:
          - integer
          - 'null'
          format: int32
          description: '`multi_choice`: fewest options to select (default 1).'
          minimum: 0
        multiline:
          type:
          - boolean
          - 'null'
          description: '`text`: show a multi-line box; when `false`, newlines are rejected.'
        pattern:
          type:
          - string
          - 'null'
          description: '`text`: regex the whole answer must match (at most 200 characters).'
        step:
          type:
          - number
          - 'null'
          format: double
          description: '`number`: the answer must be `min` (or 0) plus a multiple of `step`.'
        unit:
          type:
          - string
          - 'null'
          description: '`number`: unit shown next to the field (at most 20 characters).'
      additionalProperties: false
    HandoffInput:
      type: string
      description: What the human is asked to provide.
      enum:
      - none
      - text
      - secret
      - choice
      - multi_choice
      - number
      - confirm
      - takeover
      - credentials
    HandoffKind:
      type: string
      description: Why the agent needs a human.
      enum:
      - captcha
      - code
      - passkey
      - login
      - confirmation
      - verification
      - other
    HandoffList:
      type: object
      required:
      - handoffs
      properties:
        handoffs:
          type: array
          items:
            $ref: '#/components/schemas/HandoffView'
    HandoffOutcome:
      type: string
      description: How the human resolved the handoff.
      enum:
      - completed
      - cancelled
    HandoffPage:
      type: object
      description: Page the agent was on when it asked for help (informational only).
      properties:
        title:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
    HandoffRemember:
      type: object
      description: |-
        The site's offer to remember a sign-in or a device ("Remember me",
        "Trust this device"), shown with the question so the person decides.
        Only on `credentials` and `secret` questions.
      required:
      - label
      properties:
        label:
          type: string
          description: The option's words as the page shows them (1-80 characters).
    HandoffResponse:
      type: object
      description: The human's answer as visible to readers.
      properties:
        answered_at:
          type:
          - string
          - 'null'
          format: date-time
        by:
          type:
          - string
          - 'null'
          description: |-
            Who answered: `operator`, `service:<name>`, `token` (a response-token
            holder), or the `answered_by` an authenticated caller recorded.
        channel:
          type:
          - string
          - 'null'
          description: Which channel answered (free-form label, e.g. "slack", "web-form").
        outcome:
          $ref: '#/components/schemas/HandoffOutcome'
          description: |-
            `completed`, or `cancelled` when the human declined. A `deny` on a
            `confirm` question is a completed answer.
        remember:
          type:
          - boolean
          - 'null'
          description: What the person chose for the question's `remember` option.
        value:
          type:
          - string
          - 'null'
          description: |-
            The answer for `text`, `choice` (option id), `number` (canonical
            decimal string) and `confirm` (`approve` or `deny`).
        value_withheld:
          type: boolean
          description: |-
            True for `secret` inputs (and the password of `credentials`): the
            value is never returned. Type it into
            the page with a `type_secret` action naming this handoff; the
            control plane consumes it once.
        values:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The selected option ids for `multi_choice`.
    HandoffRisk:
      type: string
      description: How risky approving a `confirm` question is (a UI hint).
      enum:
      - low
      - high
    HandoffStatus:
      type: string
      description: Lifecycle of a handoff.
      enum:
      - pending
      - completed
      - cancelled
      - expired
    HandoffView:
      type: object
      description: A handoff as reported by the API and in webhook payloads.
      required:
      - id
      - session_id
      - host_id
      - kind
      - prompt
      - input
      - status
      - created_at
      - expires_at
      properties:
        choices:
          type: array
          items:
            $ref: '#/components/schemas/HandoffChoice'
          description: Options for `choice` and `multi_choice`, always as objects.
        confirm_label:
          type:
          - string
          - 'null'
        constraints:
          $ref: '#/components/schemas/HandoffConstraints'
        created_at:
          type: string
          format: date-time
        deny_label:
          type:
          - string
          - 'null'
        expires_at:
          type: string
          format: date-time
        host_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        input:
          $ref: '#/components/schemas/HandoffInput'
        kind:
          $ref: '#/components/schemas/HandoffKind'
        page:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoffPage'
        profile:
          type: string
          description: Profile of the session's browser.
        prompt:
          type: string
        remember:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoffRemember'
            description: The site's "remember me" option offered with the question.
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        response:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoffResponse'
        risk:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoffRisk'
            description: Set for `confirm` (default `high`).
        session_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/HandoffStatus'
        viewer_url:
          type:
          - string
          - 'null'
          description: |-
            Web viewer of the host's browser, when the host has one: open it to
            solve a CAPTCHA or approve a passkey in the remote browser.
    HostCommand:
      oneOf:
      - type: object
        description: Create an empty profile (signed out).
        required:
        - profile
        - type
        properties:
          profile:
            type: string
          type:
            type: string
            enum:
            - create_profile
      - type: object
        description: |-
          Close the profile's browser and delete its directory (cookies,
          sign-ins, storage). The `default` profile cannot be deleted.
        required:
        - profile
        - type
        properties:
          profile:
            type: string
          type:
            type: string
            enum:
            - delete_profile
      - type: object
        description: Close the profile's browser and start it again.
        required:
        - profile
        - type
        properties:
          profile:
            type: string
          type:
            type: string
            enum:
            - restart_browser
      - type: object
        description: Close the profile's browser (it starts again on the next action).
        required:
        - profile
        - type
        properties:
          profile:
            type: string
          type:
            type: string
            enum:
            - close_browser
      - type: object
        description: |-
          Start the profile's browser and open `url` in a new tab (default: the
          Google sign-in page), so a person signs in through the remote desktop
          (#340). Closing the browser afterwards saves the sign-in.
        required:
        - profile
        - type
        properties:
          profile:
            type: string
          type:
            type: string
            enum:
            - show_profile
          url:
            type:
            - string
            - 'null'
      - type: object
        description: |-
          Stop (or resume) placing new sessions on the host. Existing sessions
          keep working. Handled by the control plane; never sent to the host.
        required:
        - type
        properties:
          enabled:
            type: boolean
          type:
            type: string
            enum:
            - drain
      - type: object
        description: |-
          Connect this host's local desktop server to the fabric for a remote
          desktop tunnel (#338): the agent opens
          `GET /v1/hosts/{host_id}/desktop/{tunnel_id}` with its own credential.
          Issued only by `POST /v1/hosts/{id}/desktop-sessions`.
        required:
        - tunnel_id
        - expires_at
        - type
        properties:
          actor_display_name:
            type:
            - string
            - 'null'
            description: Who asked, for the attended desktop's on-screen notice.
          expires_at:
            type: string
            format: date-time
          tunnel_id:
            type: string
            format: uuid
          type:
            type: string
            enum:
            - open_desktop
      description: A management command for a host rather than an action in a session.
    HostCommandList:
      type: object
      required:
      - commands
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/HostCommandView'
    HostCommandRequest:
      type: object
      description: '`POST /v1/hosts/{id}/commands`'
      required:
      - command
      properties:
        command:
          $ref: '#/components/schemas/HostCommand'
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    HostCommandView:
      type: object
      description: A host command as reported to clients. States are those of operations.
      required:
      - id
      - host_id
      - command
      - state
      - created_at
      properties:
        command:
          $ref: '#/components/schemas/HostCommand'
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        host_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        result: {}
        state:
          $ref: '#/components/schemas/OperationState'
    HostList:
      type: object
      required:
      - hosts
      properties:
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/HostView'
    HostMode:
      type: string
      description: How a host runs its browsers (#336, docs/nodes.md).
      enum:
      - unattended
      - attended
      - container
    HostView:
      type: object
      description: A host agent as seen by the control plane.
      required:
      - id
      - name
      - version
      - online
      - browser_connected
      - last_seen
      properties:
        browser_connected:
          type: boolean
          description: The Chrome extension is connected to this host's native bridge.
        desktop:
          type: boolean
          description: The host can share its desktop through the fabric (#338).
        draining:
          type: boolean
          description: New sessions are not placed on this host (see [`HostCommand::Drain`]).
        id:
          type: string
          format: uuid
        last_seen:
          type: string
          format: date-time
        mode:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HostMode'
            description: 'How the host runs its browsers; absent for agents older than #336.'
        name:
          type: string
        on_demand:
          type: boolean
          description: |-
            The host launches its browser on demand, so it can take sessions
            while the browser is stopped.
        online:
          type: boolean
          description: Polled the control plane recently.
        profiles:
          type: array
          items:
            type: string
          description: Browser profiles this host has.
        running_profiles:
          type: array
          items:
            type: string
          description: Profiles whose browser is running now.
        version:
          type: string
        viewer_url:
          type:
          - string
          - 'null'
          description: |-
            Web viewer where a person can see and use this host's browser.
            Deprecated: the console's desktop viewer replaces it (#339).
    HostWork:
      oneOf:
      - type: object
        required:
        - command
        properties:
          command:
            $ref: '#/components/schemas/DispatchedCommand'
      - $ref: '#/components/schemas/DispatchedOperation'
      description: |-
        What `GET /v1/hosts/{id}/next` returns: an operation, or (to agents that
        poll with `commands=true`) a host command wrapped as `{"command": …}`.
    ItemKind:
      type: string
      description: |-
        What a secrets provider stores (E37, #590). Only `login` is implemented
        by the first providers; the enum exists so the contract does not change
        when identity details and cards arrive.
      enum:
      - login
      - identity
      - card
    Lease:
      type: object
      required:
      - lease_id
      - host_id
      - actor
      - started_at
      - expires_at
      properties:
        actor:
          $ref: '#/components/schemas/TakeoverActor'
        expires_at:
          type: string
          format: date-time
        host_id:
          type: string
          format: uuid
        lease_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
    MouseButton:
      type: string
      description: A mouse button.
      enum:
      - left
      - middle
      - right
    MouseOp:
      type: string
      description: A low-level mouse operation (`mouse` action).
      enum:
      - move
      - down
      - up
    OperationResult:
      type: object
      description: '`POST /v1/operations/{id}/result`'
      required:
      - ok
      properties:
        error:
          type:
          - string
          - 'null'
        navigation_blocked:
          type: array
          items:
            $ref: '#/components/schemas/BlockedNavigation'
          description: |-
            Navigations the browser blocked under the session's allowed sites
            since the previous action (#508).
        ok:
          type: boolean
        result: {}
    OperationState:
      type: string
      description: Lifecycle of a queued operation.
      enum:
      - queued
      - dispatched
      - succeeded
      - failed
      - timed_out
      - cancelled
    OperationView:
      type: object
      description: An operation as reported to clients.
      required:
      - id
      - session_id
      - host_id
      - action
      - state
      - created_at
      properties:
        action:
          $ref: '#/components/schemas/RemoteAction'
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        host_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        navigation_blocked:
          type: array
          items:
            $ref: '#/components/schemas/BlockedNavigation'
          description: |-
            Top-level navigations the browser blocked under the session's allowed
            sites since the previous action on this browser (#508).
        result: {}
        session_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/OperationState'
    RegisterHostRequest:
      type: object
      description: '`POST /v1/hosts/register`'
      required:
      - name
      - version
      properties:
        desktop:
          type: boolean
          description: The host has a local desktop it can share through the fabric.
        host_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Re-register with a previously issued id to keep sessions bound to it.
        mode:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HostMode'
            description: How the host runs its browsers.
        name:
          type: string
        version:
          type: string
        viewer_url:
          type:
          - string
          - 'null'
          description: |-
            Web viewer for this host's browser (`http(s)` URL), shown to people
            answering handoffs. Deprecated (#339).
    RegisterHostResponse:
      type: object
      description: Response to host registration.
      required:
      - host_id
      properties:
        host_id:
          type: string
          format: uuid
    RegisterSecretsProviderRequest:
      type: object
      description: |-
        `PUT /v1/secrets-providers/{owner_id}/{provider}`: which provider an
        owner's sessions use and what the fabric needs to call it. The token is
        Secret Material: held in memory only, never written to the state
        database, never returned, never logged.
      required:
      - kind
      properties:
        access_token:
          type:
          - string
          - 'null'
          description: The access token the provider takes. Write only.
        base_url:
          type:
          - string
          - 'null'
          description: Where the provider is (`https`, or `http` on loopback).
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the token stops working; the registration is dropped then.
        kind:
          $ref: '#/components/schemas/SecretsProviderKind'
        settings:
          description: Provider-specific, non-secret settings.
    RemoteAction:
      oneOf:
      - type: object
        description: Navigate a tab to an `http(s)` URL (or `about:blank`).
        required:
        - url
        - type
        properties:
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - navigate
          url:
            type: string
      - type: object
        description: Click the first element matching a CSS selector.
        required:
        - selector
        - type
        properties:
          selector:
            type: string
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - click
      - type: object
        description: Type text into an input, textarea or contenteditable element.
        required:
        - selector
        - text
        - type
        properties:
          clear:
            type: boolean
            description: Clear the existing value first.
          expect_origin:
            type:
            - string
            - 'null'
            description: |-
              The origin (`scheme://host[:port]`) the tab's top-level document
              must be on at the moment of typing (E37.10, #625). The control
              plane sets it for a provider action from the origin it verified;
              the extension compares it with the tab's URL and, when it differs,
              types nothing and fails with `origin_mismatch: ...`. Absent for an
              ordinary `type`; a host or extension that predates it ignores it.
          selector:
            type: string
          sensitive:
            type: boolean
            description: |-
              The text is sensitive (a password, a code): the control plane
              sends it to the host but stores and reports it as `[secret]`.
          submit:
            type: boolean
            description: Press Enter / submit the enclosing form after typing.
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          text:
            type: string
          type:
            type: string
            enum:
            - type
      - type: object
        description: |-
          Type the secret a person gave to a `secret` handoff of this session.
          The control plane resolves the value itself and consumes it: the
          caller never sees it, and the operation is reported without it. The
          host receives an ordinary `type` action.
        required:
        - handoff_id
        - selector
        - type
        properties:
          clear:
            type: boolean
            description: Clear the existing value first.
          handoff_id:
            type: string
            format: uuid
          selector:
            type: string
          submit:
            type: boolean
            description: Press Enter / submit the enclosing form after typing.
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - type_secret
      - type: object
        description: |-
          Ask the session owner's secrets provider which items it offers for the
          page's origin (E37, #590). The control plane reads the tab's top-level
          URL itself, so the model cannot name an origin. Result:
          [`SecretsLookupResult`]; never a value. Answered by the control plane,
          not the host.
        required:
        - type
        properties:
          client_label:
            type:
            - string
            - 'null'
            description: What the owner sees as the app (audit trail).
          kind:
            $ref: '#/components/schemas/ItemKind'
          provider:
            type:
            - string
            - 'null'
            description: The provider to ask; omit when the owner has only one.
          run_id:
            type:
            - string
            - 'null'
            description: The run the call belongs to, for the audit trail.
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - secrets_lookup
      - type: object
        description: |-
          Fetch one field of one item from the owner's provider and type it
          into the target with trusted input, then wipe it (E37, #590). The
          control plane re-reads the tab's origin at that moment and sends it
          to the provider; the value is never returned, logged or stored. The
          target is a `selector` in the top-level document, or a `point` that
          must not land in a frame of another origin. Result:
          [`ProviderTypedResult`].
        required:
        - item_id
        - field
        - type
        properties:
          clear:
            type: boolean
            description: Clear the existing value first.
          client_label:
            type:
            - string
            - 'null'
          field:
            $ref: '#/components/schemas/SecretField'
          item_id:
            type: string
          point:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ViewportPoint'
          provider:
            type:
            - string
            - 'null'
          purpose:
            $ref: '#/components/schemas/SecretPurpose'
          run_id:
            type:
            - string
            - 'null'
          selector:
            type:
            - string
            - 'null'
          submit:
            type: boolean
            description: Press Enter after typing.
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - type_from_provider
      - type: object
        description: |-
          Like `type_from_provider`, with a one-time code fetched immediately
          before typing. Result: [`ProviderTypedResult`] with `expires_at`.
        required:
        - item_id
        - type
        properties:
          clear:
            type: boolean
            description: Clear the existing value first.
          client_label:
            type:
            - string
            - 'null'
          item_id:
            type: string
          point:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ViewportPoint'
          provider:
            type:
            - string
            - 'null'
          run_id:
            type:
            - string
            - 'null'
          selector:
            type:
            - string
            - 'null'
          submit:
            type: boolean
            description: Press Enter after typing.
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - type_code_from_provider
      - type: object
        description: |-
          Type one field of a saved card into the target (E37.7), under the
          owner's merchant grant. Like `type_from_provider`, and stricter: the
          page must be `https`; the fabric reads the tab's **top-level** origin
          (the merchant) itself and, when the target is inside an embedded frame
          (a `point` on a payment processor's iframe), that frame's origin too,
          and passes both to the provider with the purchase's `amount` and
          `currency`; it refuses when it cannot determine a frame's origin. The
          caller never names an origin. `field: expiry` composes `MM/YY` from the
          two released parts. A card field is never submitted. Result:
          [`CardTypedResult`]; never the value.
        required:
        - item_id
        - field
        - amount
        - currency
        - type
        properties:
          amount:
            type: string
            description: 'The purchase''s amount: a decimal with at most two places.'
          clear:
            type: boolean
            description: Clear the existing value first.
          client_label:
            type:
            - string
            - 'null'
          currency:
            type: string
            description: 'The purchase''s currency: ISO 4217, three letters.'
          field:
            $ref: '#/components/schemas/CardField'
          item_id:
            type: string
          point:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ViewportPoint'
          provider:
            type:
            - string
            - 'null'
          run_id:
            type:
            - string
            - 'null'
          selector:
            type:
            - string
            - 'null'
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - type_card_field
      - type: object
        description: |-
          Choose the `<select>` option that matches one field of one item from
          the owner's provider (E37.6): a country, or the day, month or year of a
          date of birth split into three selects (`part`). The control plane
          reads the page's origin, lists the select's options, asks the provider
          for the value bound to that origin, picks the matching option itself
          and wipes the value. Result: [`ProviderSelectedResult`]; never the
          value, never which option. Failure `no_option` when nothing matches.
        required:
        - item_id
        - field
        - selector
        - type
        properties:
          client_label:
            type:
            - string
            - 'null'
          field:
            $ref: '#/components/schemas/SecretField'
          item_id:
            type: string
          part:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SelectPart'
              description: 'For a date field in separate selects: `day`, `month` or `year`.'
          provider:
            type:
            - string
            - 'null'
          run_id:
            type:
            - string
            - 'null'
          selector:
            type: string
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - select_from_provider
      - type: object
        description: |-
          Press a key (e.g. `Enter`, `Escape`, `Tab`, `ArrowDown`) on the focused
          element or on `selector` when given.
        required:
        - key
        - type
        properties:
          key:
            type: string
          selector:
            type:
            - string
            - 'null'
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - press
      - type: object
        description: Scroll the page by a delta, or scroll `selector` into view.
        required:
        - type
        properties:
          dx:
            type: integer
            format: int64
          dy:
            type: integer
            format: int64
          selector:
            type:
            - string
            - 'null'
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - scroll
      - type: object
        description: |-
          Capture the visible area of a tab. Result: `{ "mime": ..., "data": <base64> }`
          (the control plane swaps `data` for an artifact handle). The image is
          in CSS pixels, so its coordinates are the ones `click_at` takes. With
          `marks`, interactive elements are boxed and numbered in the image and
          the result lists them: `marks: [{ n, selector, x, y, w, h, text }]`.
          With `mask` (#539), the extension covers passwords, one-time codes,
          card, account and routing numbers and the other patterns of
          `packages/contracts/sensitive-patterns.json` with opaque boxes in the
          page *before* the picture is taken, and the result carries `masked`
          (how many boxes). A page it cannot mask fails the action with
          `mask_unavailable`; it never falls back to an unmasked picture. Images,
          canvases and videos are not read (a canvas over half the viewport is
          covered whole). See [`ScreenshotResult`].
        required:
        - type
        properties:
          marks:
            type: boolean
          mask:
            type: boolean
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - screenshot
      - type: object
        description: |-
          Run JavaScript in the page's main world and return its JSON value
          (`{ "value": ... }`). The script is an expression or a block whose
          last expression is the value; `await_promise` awaits a returned promise.
        required:
        - script
        - type
        properties:
          await_promise:
            type: boolean
          script:
            type: string
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - evaluate
      - type: object
        description: A trusted click at viewport CSS-pixel coordinates.
        required:
        - x
        - y
        - type
        properties:
          button:
            $ref: '#/components/schemas/MouseButton'
          click_count:
            type:
            - integer
            - 'null'
            format: int32
            description: 2 for a double click.
            minimum: 0
          modifiers:
            type: array
            items:
              type: string
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - click_at
          x:
            type: integer
            format: int64
          y:
            type: integer
            format: int64
      - type: object
        description: A trusted pointer move (hover), press or release.
        required:
        - op
        - x
        - y
        - type
        properties:
          button:
            $ref: '#/components/schemas/MouseButton'
          op:
            $ref: '#/components/schemas/MouseOp'
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - mouse
          x:
            type: integer
            format: int64
          y:
            type: integer
            format: int64
      - type: object
        description: A trusted drag from one point to another.
        required:
        - from_x
        - from_y
        - to_x
        - to_y
        - type
        properties:
          from_x:
            type: integer
            format: int64
          from_y:
            type: integer
            format: int64
          steps:
            type:
            - integer
            - 'null'
            format: int32
            description: Intermediate pointer moves (default 10).
            minimum: 0
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          to_x:
            type: integer
            format: int64
          to_y:
            type: integer
            format: int64
          type:
            type: string
            enum:
            - drag
      - type: object
        description: A trusted mouse-wheel scroll at a point.
        required:
        - x
        - y
        - type
        properties:
          dx:
            type: integer
            format: int64
          dy:
            type: integer
            format: int64
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - scroll_at
          x:
            type: integer
            format: int64
          y:
            type: integer
            format: int64
      - type: object
        description: Trusted typing at the focused element, as a keyboard would.
        required:
        - text
        - type
        properties:
          expect_origin:
            type:
            - string
            - 'null'
            description: |-
              As for `type`: the origin the tab's top-level document must be on
              when the keys are sent (E37.10).
          sensitive:
            type: boolean
            description: |-
              The text is sensitive (typed by a provider action): the control
              plane sends it to the host but stores and reports it as `[secret]`.
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          text:
            type: string
          type:
            type: string
            enum:
            - type_keys
      - type: object
        description: 'One trusted key press, with modifiers (`key: "a", modifiers: ["ctrl"]`).'
        required:
        - key
        - type
        properties:
          key:
            type: string
          modifiers:
            type: array
            items:
              type: string
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - key
      - type: object
        description: Capture the node's whole desktop (host agent). Screen pixels.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - desktop_screenshot
      - type: object
        description: Click on the node's desktop at screen coordinates (host agent).
        required:
        - x
        - y
        - type
        properties:
          button:
            $ref: '#/components/schemas/MouseButton'
          click_count:
            type:
            - integer
            - 'null'
            format: int32
            minimum: 0
          type:
            type: string
            enum:
            - desktop_click
          x:
            type: integer
            format: int64
          y:
            type: integer
            format: int64
      - type: object
        description: Move the desktop pointer (host agent).
        required:
        - x
        - y
        - type
        properties:
          type:
            type: string
            enum:
            - desktop_move
          x:
            type: integer
            format: int64
          y:
            type: integer
            format: int64
      - type: object
        description: Drag on the desktop (host agent).
        required:
        - from_x
        - from_y
        - to_x
        - to_y
        - type
        properties:
          from_x:
            type: integer
            format: int64
          from_y:
            type: integer
            format: int64
          to_x:
            type: integer
            format: int64
          to_y:
            type: integer
            format: int64
          type:
            type: string
            enum:
            - desktop_drag
      - type: object
        description: Type text into whatever has the desktop focus (host agent).
        required:
        - text
        - type
        properties:
          text:
            type: string
          type:
            type: string
            enum:
            - desktop_type
      - type: object
        description: |-
          Press a key chord on the desktop, xdotool style: `Return`, `ctrl+l`,
          `alt+F4` (host agent).
        required:
        - key
        - type
        properties:
          key:
            type: string
          type:
            type: string
            enum:
            - desktop_key
      - type: object
        description: |-
          Scroll the desktop by wheel clicks, optionally after moving to a point
          (host agent). Positive `dy` scrolls down.
        required:
        - dy
        - type
        properties:
          dy:
            type: integer
            format: int64
          type:
            type: string
            enum:
            - desktop_scroll
          x:
            type:
            - integer
            - 'null'
            format: int64
          y:
            type:
            - integer
            - 'null'
            format: int64
      - type: object
        description: Read visible text of the page or of `selector`.
        required:
        - type
        properties:
          max_chars:
            type:
            - integer
            - 'null'
            minimum: 0
          selector:
            type:
            - string
            - 'null'
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - text
      - type: object
        description: |-
          List interactive elements (links, buttons, inputs) with selectors an
          agent can use in follow-up actions.
        required:
        - type
        properties:
          max_elements:
            type:
            - integer
            - 'null'
            minimum: 0
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - elements
      - type: object
        description: Wait until an element matching `selector` exists.
        required:
        - selector
        - type
        properties:
          selector:
            type: string
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          timeout_ms:
            type:
            - integer
            - 'null'
            format: int64
            minimum: 0
          type:
            type: string
            enum:
            - wait_for
      - type: object
        description: List open tabs.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - tabs
      - type: object
        description: Open a new tab (optionally at a URL) and make it active.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - new_tab
          url:
            type:
            - string
            - 'null'
      - type: object
        description: Make a tab active and focus its window.
        required:
        - tab_id
        - type
        properties:
          tab_id:
            type: integer
            format: int64
          type:
            type: string
            enum:
            - activate_tab
      - type: object
        description: Close a tab.
        required:
        - tab_id
        - type
        properties:
          tab_id:
            type: integer
            format: int64
          type:
            type: string
            enum:
            - close_tab
      - type: object
        description: History back.
        required:
        - type
        properties:
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - back
      - type: object
        description: History forward.
        required:
        - type
        properties:
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - forward
      - type: object
        description: Reload a tab.
        required:
        - type
        properties:
          tab_id:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - reload
      description: |-
        A single bounded browser operation.

        `tab_id` is optional everywhere: when absent the extension uses the active
        tab of the last focused window.
    RemoteSessionStatus:
      type: string
      description: Session status.
      enum:
      - active
      - ended
    RenewRequest:
      type: object
      description: '`POST /v1/hosts/{id}/takeover/{lease_id}/renew`'
      properties:
        ttl_s:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    RespondHandoffRequest:
      type: object
      description: '`POST /v1/handoffs/{id}/respond`'
      properties:
        answered_by:
          type:
          - string
          - 'null'
          description: |-
            Who answered (e.g. `user:<id>`, at most 128 characters), recorded as
            the response's `by`. Honoured only with an operator or service
            token; ignored for response-token answers.
        channel:
          type:
          - string
          - 'null'
          description: Label of the answering channel, for the record.
        outcome:
          $ref: '#/components/schemas/HandoffOutcome'
        remember:
          type:
          - boolean
          - 'null'
          description: |-
            The person's choice for the question's `remember` option. Refused
            when the question offered none.
        response_token:
          type:
          - string
          - 'null'
          description: |-
            The handoff's response token (alternatively sent as the
            `X-Hexactra-Response-Token` header). Not needed with the API token.
        secret:
          type:
          - string
          - 'null'
          description: |-
            `credentials`: the password. Held and typed like a `secret` answer,
            never returned. Refused for any other input.
        value:
          type:
          - string
          - 'null'
          description: |-
            The answer for `text`, `secret`, `choice` (option id), `number`
            (decimal string) and `confirm` (`approve` or `deny`); the username
            for `credentials`.
        values:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The selected option ids for `multi_choice`.
    SaveLoginRequest:
      type: object
      description: |-
        `POST /v1/secrets-providers/{owner_id}/{provider}/save-login` (E37.4b):
        save the sign-in the owner typed into a `credentials` handoff, so the next
        run does not ask. The control plane takes the password from its own memory
        (a handoff created with `offer_save`); the caller never holds it.
      required:
      - handoff_id
      - name
      - origin
      properties:
        client_label:
          type:
          - string
          - 'null'
          description: What the owner sees as the app.
        handoff_id:
          type: string
          format: uuid
          description: The answered `credentials` handoff that holds the password.
        name:
          type: string
          description: What the owner calls the login (1-200 characters, one line).
        origin:
          type: string
          description: |-
            The origin of the sign-in page, as the caller read it from the
            browser (`https`, or `http` on loopback). The provider binds the login
            to exactly this origin.
        run_id:
          type:
          - string
          - 'null'
          description: The run the save belongs to, for the audit trail.
    SaveLoginResult:
      type: object
      description: |-
        What a save answers: that it was saved and the provider's id of the new
        login. Never the password.
      required:
      - saved
      properties:
        item_id:
          type:
          - string
          - 'null'
        saved:
          type: boolean
    ScreenshotResult:
      type: object
      description: |-
        The result of a `screenshot` action as the control plane reports it in
        [`OperationView::result`]. The extension sends `data` (base64); the control
        plane moves it to the artifact store and puts the handle (`artifact_id`,
        `size`, `expires_at`) in its place unless inline bytes were asked for.
      required:
      - mime
      properties:
        artifact_id:
          type:
          - string
          - 'null'
          format: uuid
        data:
          type:
          - string
          - 'null'
          description: The image, base64 (from the extension, or inline when asked for).
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        height:
          type:
          - integer
          - 'null'
          format: int32
          description: Image height in CSS pixels.
          minimum: 0
        marks:
          type:
          - array
          - 'null'
          items: {}
          description: 'With `marks`: the numbered elements, `{ n, selector, tag, role, text, x, y, w, h }`.'
        masked:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            With `mask`: how many regions were covered before the capture (at most
            500; at 500 the whole viewport is covered).
          minimum: 0
        mime:
          type: string
          description: '`image/jpeg`.'
        size:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        tab_id:
          type:
          - integer
          - 'null'
          format: int64
        title:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
        width:
          type:
          - integer
          - 'null'
          format: int32
          description: Image width in CSS pixels.
          minimum: 0
    SecretField:
      type: string
      description: |-
        One field of one stored item. A provider releases a single field per
        call; there is no call that returns two.
      enum:
      - username
      - password
      - full_name
      - date_of_birth
      - id_type
      - id_number
      - id_issuing_country
      - address_line1
      - address_line2
      - city
      - region
      - postal_code
      - country
      - phone
      - email
      - card_number
      - exp_month
      - exp_year
      - holder_name
      - security_code
    SecretPurpose:
      type: string
      description: Why a value is released; recorded for the owner.
      enum:
      - login
      - signup
      - password_change
      - mfa
      - form
      - purchase
      - save_login
    SecretsProviderKind:
      type: string
      description: The provider implementations a registration can name.
      enum:
      - vault
      - console
      - test
    SecretsProviderList:
      type: object
      required:
      - providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/SecretsProviderView'
    SecretsProviderView:
      type: object
