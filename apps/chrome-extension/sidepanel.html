<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hexactra AI - Side Panel</title>
  <style>
    /* hexactra brand tokens (docs/brand/README.md); dark follows the system setting. */
    :root {
      color-scheme: light dark;
      --hx-primary: #4b4be8;
      --hx-primary-hover: #3b3bd0;
      --hx-on-primary: #ffffff;
      --hx-accent: #ff6b4a;
      --hx-danger: #c2412a;
      --hx-danger-hover: #a33520;
      --hx-on-danger: #ffffff;
      --hx-bg: #f6f6fb;
      --hx-surface: #ffffff;
      --hx-surface-2: #eeeef6;
      --hx-surface-2-hover: #e3e4ef;
      --hx-text: #12131c;
      --hx-muted: #5a5e72;
      --hx-border: #e3e4ef;
      --hx-info-bg: #e4e4fb;
      --hx-info-text: #2e2ea8;
      --hx-error-bg: #ffe3db;
      --hx-error-text: #8a2a12;
      --hx-focus: rgba(75, 75, 232, 0.25);
      --hx-display: 'Space Grotesk', 'Inter', 'Helvetica Neue', Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hx-primary: #8c8cff;
        --hx-primary-hover: #a3a3ff;
        --hx-on-primary: #0d0e17;
        --hx-accent: #ff8a6e;
        --hx-danger: #ff8a6e;
        --hx-danger-hover: #ffa48d;
        --hx-on-danger: #0d0e17;
        --hx-bg: #0d0e17;
        --hx-surface: #181a28;
        --hx-surface-2: #23263a;
        --hx-surface-2-hover: #2e3149;
        --hx-text: #ecedf7;
        --hx-muted: #a3a7bd;
        --hx-border: #2a2d42;
        --hx-info-bg: #23236b;
        --hx-info-text: #dcdcfa;
        --hx-error-bg: #4a1d12;
        --hx-error-text: #ffd2c6;
        --hx-focus: rgba(140, 140, 255, 0.35);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--hx-bg);
      color: var(--hx-text);
      min-width: 320px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .logo .trace {
      stroke: var(--hx-primary);
    }

    .logo .start {
      fill: var(--hx-accent);
    }

    .title {
      font-family: var(--hx-display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .title-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--hx-muted);
      border: 1px solid var(--hx-border);
      border-radius: 999px;
      padding: 3px 8px;
    }

    .status {
      padding: 8px 12px;
      background-color: var(--hx-info-bg);
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--hx-info-text);
    }

    .status.error {
      background-color: var(--hx-error-bg);
      color: var(--hx-error-text);
    }

    .button-group + .status {
      margin-top: 12px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--hx-focus);
    }

    .btn-primary {
      background-color: var(--hx-primary);
      color: var(--hx-on-primary);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--hx-primary-hover);
    }

    .btn-secondary {
      background-color: var(--hx-surface-2);
      color: var(--hx-text);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--hx-surface-2-hover);
    }

    .btn-danger {
      background-color: var(--hx-danger);
      color: var(--hx-on-danger);
    }

    .btn-danger:hover:not(:disabled) {
      background-color: var(--hx-danger-hover);
    }

    .observation-section {
      margin-top: 24px;
    }

    .section-title {
      font-family: var(--hx-display);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--hx-text);
    }

    .elements-list {
      max-height: 200px;
      overflow-y: auto;
      background-color: var(--hx-surface);
      border: 1px solid var(--hx-border);
      border-radius: 8px;
      padding: 8px;
    }

    .element-item {
      padding: 6px 8px;
      margin-bottom: 4px;
      background-color: var(--hx-surface-2);
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .element-item:hover {
      background-color: var(--hx-surface-2-hover);
    }

    .provider-section {
      margin-top: 24px;
      padding: 16px;
      background-color: var(--hx-surface);
      border: 1px solid var(--hx-border);
      border-radius: 12px;
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--hx-muted);
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .screenshot {
      margin-top: 16px;
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--hx-border);
    }

    .empty-state {
      text-align: center;
      color: var(--hx-muted);
      font-size: 12px;
      padding: 20px;
    }

    textarea,
    input,
    select {
      width: 100%;
      padding: 8px;
      background-color: var(--hx-surface);
      color: var(--hx-text);
      border: 1px solid var(--hx-border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    textarea:focus,
    input:focus,
    select:focus {
      outline: none;
      border-color: var(--hx-primary);
      box-shadow: 0 0 0 3px var(--hx-focus);
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <path class="trace" d="M60 60V108L18.4 84V36L60 12L101.6 36V84L80 96.5" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="start" cx="60" cy="60" r="13"/>
    </svg>
    <h1 class="title" aria-label="Hexactra AI" style="margin: 0">hexactra</h1>
    <span class="title-tag" aria-hidden="true">AI</span>
  </div>

  <div id="status" class="status">Ready to initialize</div>

  <div class="controls">
    <button id="initialize-btn" class="btn-primary">Initialize Tab</button>
    <button id="observe-btn" class="btn-secondary">Observe DOM</button>
    <button id="screenshot-btn" class="btn-secondary">Take Screenshot</button>
  </div>

  <!-- Task Controls -->
  <div class="provider-section">
    <div class="section-title">Task Controls</div>
    
    <div class="control-group">
      <label for="task-goal" class="control-label">Task Goal</label>
      <textarea id="task-goal" rows="3" placeholder="Describe what you want the browser to do..."></textarea>
    </div>

    <div class="button-group">
      <button id="start-task-btn" class="btn-primary">Start Task</button>
      <button id="pause-task-btn" class="btn-secondary" disabled>Pause</button>
      <button id="resume-task-btn" class="btn-secondary" disabled>Resume</button>
      <button id="stop-task-btn" class="btn-danger" disabled>Stop</button>
    </div>

    <div id="task-status" class="status">No active task</div>

    <div class="control-group">
      <label class="control-label">Task History</label>
      <div id="task-history" class="elements-list" style="max-height: 150px;">
        <div class="empty-state">No task history yet</div>
      </div>
    </div>
  </div>

  <div class="observation-section">
    <div class="section-title">Observed Elements</div>
    <div id="elements-list" class="elements-list">
      <div class="empty-state">No elements observed yet</div>
    </div>
  </div>

  <!-- Provider Configuration -->
  <div class="provider-section">
    <div class="section-title">Provider Configuration</div>
    
    <div class="control-group">
      <label for="provider-select" class="control-label">Select Provider</label>
      <select id="provider-select">
        <option value="">-- Select a provider --</option>
      </select>
    </div>

    <div class="control-group">
      <label for="provider-name" class="control-label">Provider Name</label>
      <input type="text" id="provider-name" placeholder="e.g., My OpenAI Key">
    </div>

    <div class="control-group">
      <label for="provider-url" class="control-label">API Base URL</label>
      <input type="text" id="provider-url" placeholder="https://api.openai.com/v1">
    </div>

    <div class="control-group">
      <label for="provider-model" class="control-label">Model ID</label>
      <input type="text" id="provider-model" placeholder="gpt-4">
    </div>

    <div class="control-group">
      <label for="provider-key" class="control-label">API Key</label>
      <input type="password" id="provider-key" placeholder="sk-...">
    </div>

    <div class="button-group">
      <button id="test-connection-btn" class="btn-secondary">Test Connection</button>
      <button id="add-provider-btn" class="btn-primary">Add Provider</button>
      <button id="remove-provider-btn" class="btn-danger">Remove Provider</button>
    </div>
  </div>

  <div class="observation-section">
    <div class="section-title">Screenshot</div>
    <div id="screenshot"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
