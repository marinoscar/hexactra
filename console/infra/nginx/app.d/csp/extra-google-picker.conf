# =============================================================================
# Google's file picker (E39.10, #607): the frame it draws
# =============================================================================
# The delivery editor's spreadsheet and folder choosers open Google's own file
# picker for a Google connection, so the owner can choose files the console may
# then use under the narrow `drive.file` permission. The picker draws its dialog
# in a frame from docs.google.com. Without this the frame falls back to
# default-src 'self' and is refused; every other page is unaffected, because the
# picker script itself is only added to the document when the dialog opens.
#
# `frame-src` is a directive the platform's policy does not carry, so it is the
# `extra` include. It lists 'self' first so nothing the console frames today
# changes. The picker's SCRIPT host (apis.google.com) is NOT here: the platform
# policy has no script-src include on purpose, and an upstream seam request asks
# for one (console/docs/connections.md, "Choosing files: the picker"). Until it
# lands the picker reports that it could not load and the dialog offers the
# paste-a-link route instead.
default "; frame-src 'self' https://docs.google.com";
