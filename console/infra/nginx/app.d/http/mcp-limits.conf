# =============================================================================
# External AI apps (#465): the coarse outer rate limits, per source address
# =============================================================================
# The API limits /api/mcp per credential, per app and per user
# (apps/api/src/mcp/mcp.rate-limit.ts, admin page "External AI apps"); these
# zones are only the outer fence in front of it, per address, for the paths a
# public console must expose: /api/mcp, /api/oauth/ and /.well-known/.
#
# Generous on purpose: ChatGPT and Claude call from their vendors' shared
# egress addresses, so every user of one vendor shares one address here.
#
# The key is $binary_remote_addr: the address nginx sees. Behind another proxy
# (the VPS host proxy, a tunnel) that is the proxy, unless that proxy's
# address is trusted with set_real_ip_from in a server-level overlay
# (docs/runbooks/public-exposure.md, "Rate limits behind another proxy").
#
# A key that is empty is not counted: each map below selects its own paths.
# =============================================================================

map $uri $hexactra_oauth_limit_key {
    ~^/api/oauth/   $binary_remote_addr;
    default         "";
}

map $uri $hexactra_well_known_limit_key {
    ~^/\.well-known/   $binary_remote_addr;
    default            "";
}

limit_req_zone $binary_remote_addr zone=hexactra_mcp:10m rate=1200r/m;
limit_req_zone $hexactra_oauth_limit_key zone=hexactra_oauth:10m rate=120r/m;
limit_req_zone $hexactra_well_known_limit_key zone=hexactra_well_known:10m rate=120r/m;
