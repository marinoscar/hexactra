# The Android companion's edge locations: /.well-known/assetlinks.json to the
# API (Chrome verifies the app with it, which is what makes it open full
# screen AND delegate the site's notifications to the APK), the APK upload
# and the signed download. The locations live in the platform snippet
# (generated by `platform-infra sync`); this app-owned file opts the console
# in. Without it the path falls through to the SPA's index.html.
include /etc/nginx/platform/android-app.conf;
