# =============================================================================
# The benchmark challenge site, /benchmark/ (E44.2, #740)
# =============================================================================
# A benchmark (docs/benchmark.md) runs its trials in a real Chrome on a node,
# against challenge pages the console API serves itself. This location
# publishes them at https://<console>/benchmark/ so a node's browser reaches
# them over the console's own name and certificate:
#
#   /benchmark/t/<token>/...   ->  /api/benchmark-site/t/<token>/...
#   /benchmark/assets/<file>   ->  /api/benchmark-site/assets/<file>
#
# The pages are public: a trial's browser has no console session. The token in
# the path opens one trial's fixture pages while that trial is running, and the
# API answers the same 404 for anything else.
#
#   access_log off            the token is a path segment of every page, and a
#                             credential does not belong in an access log (the
#                             API's request log and its traces leave it out too)
#   client_max_body_size 64k  the API's own limit for a page's form post or
#                             script call; a larger body is refused here
#
# A prefix location: it does not match /benchmarks (the console's own pages),
# only paths under /benchmark/. No add_header here, so the server-level
# security headers apply; the API adds its own, stricter Content-Security-Policy
# for these pages and a browser enforces both.
# =============================================================================

location /benchmark/ {
    access_log off;

    proxy_pass http://api_upstream/api/benchmark-site/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    client_max_body_size 64k;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
