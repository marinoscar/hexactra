# The Connections OAuth callbacks (E39.2, #599): the browser arrives from Google or Microsoft with `?code=...&state=...` in the
# URL. The code is single-use, short-lived and bound to a PKCE verifier only the API holds, but a secret does not belong in an
# access log, so these locations are not logged (the API's own request log and its traces leave the query out too). Same
# proxying as the rest of `/api`; exact matches, so only the two callbacks are affected. No add_header here, so the
# server-level security headers apply.
location ~ ^/api/connections/callback/(google|microsoft)$ {
    access_log off;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
