# =============================================================================
# Browser hosts reach the fabric over HTTPS at /fabric/ (APP-OWNED)
# =============================================================================
# A browser host (hexactra-agent on your desktop or another machine) only makes
# OUTBOUND requests: it enrolls once, then long-polls for work and posts
# results. So it can connect through this deployment's own TLS vhost,
# https://<console>/fabric, with no VPN and no extra port.
#
# Only the HOST protocol is published. Everything else under /fabric/ (the
# client, admin and operator APIs, the event stream, artifacts) answers 404 and
# never reaches the fabric: those stay on the private network, for the console
# alone. The fabric still authenticates every host route itself:
#   - POST /v1/hosts/enroll takes a single-use, short-lived hxe_ enrollment
#     token (minted by an admin on the Fleet page);
#   - every other host route takes that host's own credential and may act only
#     for its own host id.
# =============================================================================

location = /fabric/v1/health {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $hexactra_fabric_upstream http://fabric-control:8787;
    rewrite ^/fabric/(.*)$ /$1 break;
    proxy_pass $hexactra_fabric_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
}

location ~ "^/fabric/v1/hosts/(enroll|register|[0-9a-fA-F-]{36}/(next|offline|operations/[0-9a-fA-F-]{36}/result|commands/[0-9a-fA-F-]{36}/result))$" {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $hexactra_fabric_upstream http://fabric-control:8787;
    rewrite ^/fabric/(.*)$ /$1 break;
    proxy_pass $hexactra_fabric_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Long-poll: the fabric holds /next for up to 30 s.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    # Operation results carry screenshots (the fabric accepts up to 25 MB).
    client_max_body_size 30m;
}

# The node's leg of a remote desktop tunnel (#338): a WebSocket the agent
# opens with its own host credential after the fabric asked it to. The
# viewer's leg (/v1/desktop/<id>/connect) and the route that creates tunnels
# stay private: the console reaches them on the private network.
location ~ "^/fabric/v1/hosts/[0-9a-fA-F-]{36}/desktop/[0-9a-fA-F-]{36}$" {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $hexactra_fabric_upstream http://fabric-control:8787;
    rewrite ^/fabric/(.*)$ /$1 break;
    proxy_pass $hexactra_fabric_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A tunnel lasts at most an hour (HEXACTRA_DESKTOP_MAX_S); the fabric pings every 20 s.
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;
    proxy_buffering off;
}

# Anything else under /fabric/ is private.
location /fabric/ {
    return 404;
}
