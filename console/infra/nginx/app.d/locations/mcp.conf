# =============================================================================
# The MCP endpoint, /api/mcp (#465): what hosted AI apps call
# =============================================================================
# Its own location so that, unlike the rest of the API (location /api, 60 s):
#
#   proxy_read_timeout 300s   a tool may wait up to 200 s for a run or an
#                             answer (run_wait, ask_human, E33.5), plus the
#                             model's own time; at least 240 s.
#   client_max_body_size 1m   the API's own body limit for /api/mcp (1 MiB):
#                             a bigger body is refused here before it is read.
#   limit_req                 the per-address outer limit (http/mcp-limits.conf);
#                             the API limits per credential, app and user.
#
# A regex location: tried before the prefix `location /api`, and it also
# covers the trailing-slash form the API accepts. No add_header here, so the
# server-level security headers apply.
# =============================================================================

location ~ ^/api/mcp/?$ {
    limit_req zone=hexactra_mcp burst=300 nodelay;
    limit_req_status 429;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    client_max_body_size 1m;

    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # One JSON answer per request: buffer it, but never cache it.
    proxy_buffering on;
    proxy_cache off;
}
