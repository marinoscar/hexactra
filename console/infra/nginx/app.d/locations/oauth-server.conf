# The OAuth server's well-known documents (E33.1, #459): /.well-known/oauth-authorization-server
# and /.well-known/oauth-protected-resource[/<path>] (the MCP endpoint's is
# /.well-known/oauth-protected-resource/api/mcp) to the API, and a JSON 404 for
# /.well-known/openid-configuration and every other /.well-known/oauth-* path.
# Hosted AI clients (ChatGPT, Claude) discover how to sign in from these root
# paths. The locations live in the platform snippet (generated by
# `platform-infra sync`); this app-owned file opts the console in. Without it
# the paths fall through to the SPA's index.html.
include /etc/nginx/platform/oauth-server.conf;
