# =============================================================================
# The built-in secrets store's internal release route is NOT public (APP-OWNED)
# =============================================================================
# `/api/internal/secrets-store/v1/*` (E37.5) is how the fabric asks for ONE field
# of ONE saved login. It is authenticated with a credential the console hands the
# fabric, bound to one owner, and nothing else is accepted there, but it is not
# something a browser or an AI app ever calls. The fabric reaches the API
# directly over the stack's private network (SECRETS_STORE_CALLBACK_URL, default
# http://api:3000), never through this proxy, so the public side answers 404 for
# the whole prefix: it adds no way in even if a credential leaked, and a value is
# never carried across the proxy's access log or an edge cache.
# =============================================================================

location ^~ /api/internal/ {
    return 404;
}
