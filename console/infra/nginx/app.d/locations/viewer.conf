# =============================================================================
# The bundled browser host's viewer (noVNC) at /viewer/local/ (APP-OWNED)
# =============================================================================
# Every request is checked by the API first (auth_request): a one-time ticket
# from POST /api/fleet/viewer-ticket (fleet:write) is exchanged for an
# HttpOnly cookie scoped to /viewer/; without one nginx answers 401 and never
# contacts the host. The upstream is a variable so nginx still starts when the
# fabric overlay is not running (Docker's DNS resolves it per request).
# =============================================================================

location = /_hexactra_viewer_auth {
    internal;
    proxy_pass http://api_upstream/api/fleet/viewer-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # An auth_request subrequest has no query string of its own ($arg_ticket
    # is empty here): pass the original URI and let the API read the ticket.
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Viewer-Cookie $cookie_hx_viewer;
    proxy_set_header X-Request-ID $request_id;
}

location /viewer/local/ {
    auth_request /_hexactra_viewer_auth;
    auth_request_set $hexactra_viewer_cookie $upstream_http_x_viewer_set_cookie;
    # A location's add_header replaces the server's: repeat the security headers.
    include /etc/nginx/platform/security-headers.conf;
    add_header Set-Cookie $hexactra_viewer_cookie always;
    add_header Cache-Control "no-store" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $hexactra_viewer_upstream http://fabric-host:6080;
    rewrite ^/viewer/local/(.*)$ /$1 break;
    proxy_pass $hexactra_viewer_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $hexactra_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# =============================================================================
# Remote desktops of every host at /viewer/<hostId>/websockify (#339)
# =============================================================================
# The browser's WebSocket carries only an HttpOnly cookie scoped to
# /viewer/<hostId>/ (POST /api/fleet/hosts/<id>/viewer-session, fleet:desktop).
# auth_request asks the API, which checks the session (bound to this host, the
# user and the organization, stored in the database, revocable), re-checks the
# user's permission and asks the fabric for a tunnel. nginx then proxies the
# WebSocket to the fabric's viewer leg with the tunnel's single-use token,
# which never reaches the browser (and is not logged: the default log format
# has no request headers). The cookie is not forwarded.
# =============================================================================

location = /_hexactra_desktop_auth {
    internal;
    proxy_pass http://api_upstream/api/fleet/desktop-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Desktop-Cookie $cookie_hx_desktop;
    proxy_set_header X-Request-ID $request_id;
}

location ~ "^/viewer/[0-9a-fA-F-]{36}/websockify$" {
    auth_request /_hexactra_desktop_auth;
    auth_request_set $hexactra_desktop_tunnel $upstream_http_x_desktop_tunnel;
    auth_request_set $hexactra_desktop_auth $upstream_http_x_desktop_authorization;
    include /etc/nginx/platform/security-headers.conf;
    add_header Cache-Control "no-store" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    # Variables in proxy_pass (content phase): no rewrite needed.
    proxy_pass http://fabric-control:8787/v1/desktop/$hexactra_desktop_tunnel/connect;
    proxy_http_version 1.1;
    proxy_set_header Host fabric-control:8787;
    proxy_set_header Authorization $hexactra_desktop_auth;
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $hexactra_connection_upgrade;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;
    proxy_buffering off;
}

# Nothing else under /viewer/ is served.
location /viewer/ {
    return 404;
}
