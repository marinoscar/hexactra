# External AI apps (#465): the per-address outer limits of the OAuth server
# (/api/oauth/) and the discovery documents (/.well-known/), at server level so
# the platform's own locations for them inherit it (a location that declares
# its own limit_req, such as /api/mcp in locations/mcp.conf, does not). The
# zones and the path-selecting keys are in http/mcp-limits.conf.
limit_req zone=hexactra_oauth burst=60 nodelay;
limit_req zone=hexactra_well_known burst=60 nodelay;
limit_req_status 429;
