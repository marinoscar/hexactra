[package]
name = "hexactra-aef-connector"
version = "0.1.0"
edition = "2021"

[dependencies]
hexactra-core = { path = "../hexactra-core" }
tokio = { version = "1.39", features = ["time", "net", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
