[package]
name = "hexactra-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
hexactra-otel = { path = "../hexactra-otel" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
tokio-native-tls.workspace = true
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
futures-util.workspace = true
libc = "0.2"
chrono.workspace = true

hexactra-core = { path = "../hexactra-core" }
hexactra-telemetry = { path = "../hexactra-telemetry" }
hexactra-client = { path = "../hexactra-client" }
hexactra-desktop-input = { path = "../hexactra-desktop-input" }

# Optional Windows support
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winbase"] }

[dev-dependencies]
# `test-util`: paused time, so a test can tell "no retry sleep ran" without a wall clock (#493).
tokio = { workspace = true, features = ["test-util"] }
tokio-test.workspace = true
tempfile.workspace = true
