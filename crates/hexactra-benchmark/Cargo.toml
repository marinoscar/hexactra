[package]
name = "hexactra-benchmark"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "benchmark"
path = "src/main.rs"

[[bin]]
name = "fixture-server"
path = "src/fixture_server.rs"
harness = false

[dependencies]
hexactra-core = { path = "../hexactra-core" }
hexactra-aef-connector = { path = "../hexactra-aef-connector" }
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
criterion = "0.5"
axum = { version = "0.8", features = ["json", "macros"] }
rand = "0.9"

[dev-dependencies]
mockall = "0.13"
