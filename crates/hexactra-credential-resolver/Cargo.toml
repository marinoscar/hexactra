[package]
name = "hexactra-credential-resolver"
version = "0.1.0"
edition = "2021"
description = "Secrets provider contract (E37): how a stored secret gets from a provider into a page without anything else holding it"

[features]
default = []
# A fixed-fixture provider for tests and local development. Never enabled in
# a release build of the control plane.
test-provider = ["dep:axum"]

[dependencies]
async-trait = "0.1"
# Only the fake Vault of the `test-provider` feature serves HTTP.
axum = { workspace = true, optional = true }
chrono = { version = "0.4", features = ["serde"] }
hexactra-core = { path = "../hexactra-core" }
psl = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["time", "rt", "net", "macros"] }
url = "2"
zeroize = "1"

[dev-dependencies]
axum = { workspace = true }
static_assertions = "1"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
