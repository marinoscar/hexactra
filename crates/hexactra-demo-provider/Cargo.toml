[package]
name = "hexactra-demo-provider"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hexactra-credential-resolver = { path = "../hexactra-credential-resolver" }
hexactra-notification-delivery = { path = "../hexactra-notification-delivery" }
hexactra-provider-sdk = { path = "../hexactra-provider-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "test-util"] }
