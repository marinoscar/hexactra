[package]
name = "hexactra-otel"
version.workspace = true
edition.workspace = true
description = "OpenTelemetry setup and trace-context propagation for the Hexactra fabric"
publish = false

[dependencies]
anyhow.workspace = true
http = "1"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "http-proto", "http-json", "reqwest-blocking-client"] }
tracing.workspace = true
tracing-opentelemetry = "0.34"
tracing-subscriber.workspace = true
